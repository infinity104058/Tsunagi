name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  test:
    runs-on: docker
    container:
      image: python:3.11-slim
    steps:
      - name: Checkout
        run: |
          apt-get update && apt-get install -y --no-install-recommends git
          git clone --depth 1 --branch "${GITHUB_REF_NAME}" \
            "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" .
      - name: Install dependencies
        run: |
          pip install --no-cache-dir -r requirements.txt -r requirements-dev.txt ruff
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: pytest -q